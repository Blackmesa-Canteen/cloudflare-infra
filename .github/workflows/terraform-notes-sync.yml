name: Terraform (notes-sync)

on:
  pull_request:
  push:
    branches: [main]

# No `paths:` filter: `Plan` is a required status check on main, and a
# path-filtered required check never reports (so never merges) on a PR
# that doesn't touch those paths. Running plan/validate on every PR is
# cheap enough for one stack; revisit if/when this repo gets many stacks.

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_TFSTATE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_TFSTATE_SECRET_ACCESS_KEY }}
  # Env var name is fixed by the cloudflare provider's own convention;
  # the secret backing it is named for what it's actually scoped to
  # (R2 only) so a future stack's token doesn't get confused with this
  # one or tempt someone into widening it instead of adding a new one.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: stacks/notes-sync

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # Only this job needs pull-requests:write, to post the plan comment.
    # Note: for a PR opened from a fork, GitHub does not pass repository
    # secrets to a `pull_request`-triggered run at all (they evaluate to
    # empty) — this job fails safe (auth error) rather than leaking
    # anything, and fork PR runs additionally require manual approval
    # before they execute (see repo Settings > Actions).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: .

      - name: terraform init
        run: |
          cat > backend-config.hcl <<HCL
          endpoints = {
            s3 = "https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com"
          }
          HCL
          terraform init -input=false -backend-config=backend-config.hcl

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = `#### Terraform Plan — notes-sync\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Approval gate only — this Environment holds no secrets of its own.
    # Secrets stay at repo level (see env: above) so the plan job on PRs
    # doesn't also require manual approval; only apply does.
    environment: infra-apply
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: terraform init
        run: |
          cat > backend-config.hcl <<HCL
          endpoints = {
            s3 = "https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com"
          }
          HCL
          terraform init -input=false -backend-config=backend-config.hcl

      - name: terraform apply
        run: terraform apply -input=false -auto-approve
